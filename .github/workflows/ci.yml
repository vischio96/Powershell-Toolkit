name: Verifica script

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Verifica sintassi, versioni e changelog
        shell: pwsh
        run: ./.github/scripts/Test-Toolkit.ps1
