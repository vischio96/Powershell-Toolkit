name: Rilascio script

# Un tag nel formato <slug>-v<versione> (es. ad-security-report-v2.0) pubblica una release
# contenente solo la cartella dello script indicato. Il rilascio fallisce se la versione del tag
# non coincide con $ScriptVersion nello script o se manca la sezione corrispondente nel CHANGELOG.
on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Verifica tag e prepara il pacchetto
        id: pkg
        shell: pwsh
        run: ./.github/scripts/Test-Toolkit.ps1 -Tag "${{ github.ref_name }}" -OutDir "${{ runner.temp }}/release"

      - name: Pubblica la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ steps.pkg.outputs.zip }}" --title "${{ steps.pkg.outputs.title }}" --notes-file "${{ steps.pkg.outputs.notes }}" --verify-tag
